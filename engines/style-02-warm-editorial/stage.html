<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<style>
:root{--bg:#F0EEE6;--ivory:#FAF9F5;--oat:#E3DACC;--ink:#141413;--slate:#3D3D3A;--mute:#87867F;--clay:#D97757;--clayd:#C6613F;--sage:#788C5D;--sky:#6A9BCC;--kraft:#D4A27F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",sans-serif;position:relative}
.serif,h1{font-family:"Noto Serif SC",serif}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5}
.top{position:absolute;left:72px;right:72px;top:88px;display:flex;justify-content:space-between;align-items:center;font-size:28px;color:var(--slate)}
.chip{display:flex;align-items:center;gap:12px;font-weight:700}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--clay);display:inline-block}
.prog{position:absolute;left:72px;right:72px;top:146px;height:4px;background:var(--oat);border-radius:2px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:2px}
h1{position:absolute;left:72px;right:72px;top:186px;font-size:76px;line-height:1.22;font-weight:900;letter-spacing:1px}
h1 em{font-style:normal;color:var(--clayd);position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:-4px;right:-4px;bottom:2px;height:16px;background:var(--clay);opacity:.22;border-radius:8px;z-index:-1}
#stage{position:absolute;left:72px;top:430px;width:936px;height:880px}
.abs{position:absolute}
.card{position:absolute;background:var(--ivory);border:4px solid var(--ink);border-radius:28px;padding:30px 32px;box-shadow:8px 8px 0 rgba(20,20,19,.9)}
.card .k{font-family:"Noto Serif SC",serif;font-size:46px;font-weight:900}
.card .d{font-size:30px;color:var(--slate);line-height:1.5;margin-top:8px}
.swatch{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);margin-bottom:14px}
.analogy{margin-top:16px;display:inline-block;font-size:32px;font-weight:800;background:var(--bg);border:3px solid var(--ink);border-radius:999px;padding:6px 20px}
.big-num{font-family:"Noto Serif SC",serif;font-size:200px;font-weight:900;color:var(--clayd);line-height:1}
.big-num .cap{font-family:"Noto Sans SC";font-size:40px;color:var(--ink);font-weight:800;margin-top:10px}
.stamp{font-family:"Noto Serif SC",serif;font-size:100px;font-weight:900;color:var(--ivory);background:var(--clay);border:6px solid var(--ink);border-radius:28px;padding:20px 50px;box-shadow:10px 10px 0 var(--ink)}
.meter{height:44px;border:4px solid var(--ink);border-radius:22px;margin-top:22px;overflow:hidden;background:var(--bg)}
.meter i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--clay) 0 18px,var(--clayd) 18px 36px);width:100%}
.row{display:flex}
.ticket{width:50px;height:62px;background:var(--ivory);border:3px solid var(--ink);border-radius:6px;display:inline-block}
.pkg{font-size:70px}
.phone{background:var(--ivory);border:4px solid var(--ink);border-radius:40px;padding:20px 22px 30px;box-shadow:8px 8px 0 var(--ink);height:520px;position:relative}
.ph-top{text-align:center;font-weight:800;font-size:28px;border-bottom:3px solid var(--oat);padding-bottom:12px;margin-bottom:20px}
.bub{font-size:30px;padding:16px 22px;border-radius:24px;border:3px solid var(--ink);margin:14px 0;max-width:88%;line-height:1.35}
.bub.l{background:var(--bg)}.bub.r{background:#F3D6C7;margin-left:auto}
.tagx{position:absolute;right:20px;bottom:24px;background:var(--clay);color:var(--ivory);font-weight:900;font-size:34px;padding:10px 24px;border-radius:16px;border:3px solid var(--ink)}
.doc{background:var(--ivory);border:4px solid var(--ink);border-radius:20px;padding:24px 28px;box-shadow:8px 8px 0 var(--ink);height:520px;position:relative}
.doc-h{font-family:"Noto Serif SC";font-weight:900;font-size:32px;margin-bottom:18px}
.doc b{display:block;font-size:28px;margin-top:14px}.doc i{display:block;height:12px;background:var(--oat);border-radius:6px;margin-top:10px}
.msg{width:52px;height:40px;border:3px solid var(--ink);border-radius:12px;display:inline-block}
.lbl{font-size:32px;font-weight:800;margin-bottom:12px}
.hbar{height:96px;width:var(--w);border:4px solid var(--ink);border-radius:20px;display:flex;align-items:center;padding:0 26px;font-size:40px;font-weight:900;color:var(--ink);white-space:nowrap;box-shadow:6px 6px 0 var(--ink)}
.hbar .cnt{font-family:"Noto Serif SC";font-size:52px;margin-right:8px}
.flip{display:flex;flex-direction:column;justify-content:center}
.qm{position:absolute;right:24px;top:6px;font-family:"Noto Serif SC";font-size:110px;font-weight:900;opacity:.6}
.note{background:#F5E3B0;border:4px dashed var(--ink);border-radius:20px;padding:24px 28px;font-size:32px;line-height:1.5}
.pillx{background:var(--ivory);border:4px solid var(--ink);border-radius:999px;padding:14px 28px;box-shadow:6px 6px 0 var(--ink)}
#sub{position:absolute;left:60px;right:60px;top:1336px;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:46px;line-height:1.45;font-weight:700;padding:24px 44px;text-wrap:balance;background:var(--ivory);border:4px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink)}
#sub b{color:var(--clayd)}
.foot{position:absolute;left:72px;top:1650px;font-size:24px;color:var(--mute)}
/* entry animations */
@keyframes fu{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}65%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes sl{from{opacity:0;transform:translateX(-140px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(140px)}to{opacity:1;transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-260px)}60%{opacity:1;transform:translateY(16px)}80%{transform:translateY(-6px)}100%{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-14deg)}60%{opacity:1;transform:scale(.94) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes flip{0%{opacity:0;transform:perspective(900px) rotateY(95deg)}100%{opacity:1;transform:perspective(900px) rotateY(0)}}
@keyframes merge{0%{opacity:0;transform:translateX(120px) rotate(20deg)}100%{opacity:1;transform:none}}
@keyframes grow{from{width:0}to{width:100%}}
@keyframes growx{from{width:0;opacity:.3}to{width:var(--w);opacity:1}}
@keyframes drawa{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes out{from{opacity:1}to{opacity:0}}
@keyframes dim{from{opacity:1}to{opacity:.1}}
/* loops */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(14deg)}30%{transform:rotate(-10deg)}40%{transform:rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flame{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.25) scaleX(.9)}}
@keyframes mv{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes wave{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@keyframes wx{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
@keyframes scan{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(8deg)}}
@keyframes splash{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}50%{opacity:1}100%{opacity:0;transform:translate(30px,-40px)}}
@keyframes lid{0%,30%{transform:rotateX(0)}60%,100%{transform:scaleY(.08)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes sand{0%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.loop-bob{animation:bob 2.6s ease-in-out infinite}
.loop-shake{animation:shake 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.loop-ring{animation:ring 1.3s ease-in-out infinite}
.loop-eye{animation:eye 3s infinite;transform-box:fill-box;transform-origin:center}
.loop-sand{animation:sand 4s linear infinite;transform-box:fill-box;transform-origin:bottom}
.spin{animation:spin 2.4s linear infinite}
.flame{animation:flame .5s ease-in-out infinite}
.bell{animation:ring 1.6s ease-in-out infinite}
.orbit{animation:spin 8s linear infinite}
.orbit>.cr{animation:spin 8s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.dot{animation:mv 1.8s linear infinite}
.mover{animation:mv 2.2s ease-in-out infinite}
.mover-slow{animation:mv 2.6s ease-in-out infinite}
.drop{animation:mv 1.8s ease-in infinite}
.pass{animation:mv 2.4s linear infinite}
.runner{offset-path:path('M165 450 C 300 510, 380 510, 465 450 S 650 390, 765 450');offset-rotate:0deg;animation:mvr 3s ease-in-out infinite alternate}
@keyframes mvr{from{offset-distance:0%}to{offset-distance:100%}}
.wave{animation:wave 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.wavex{animation:wx 3s ease-in-out infinite}
.scan{animation:scan 3s ease-in-out infinite}
.splash{animation:splash .9s ease-in-out infinite;transform-box:fill-box}
.zzz{animation:zz 2s ease-out infinite}
.lid{animation:lid 3.5s ease-in-out infinite}
.flow{animation:dash 1s linear infinite}
.draw,.draw-slow{stroke-dasharray:1}
svg [data-a]{transform-box:fill-box;transform-origin:center}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker></defs></svg>
<div class="blob" id="b1" style="width:420px;height:420px;left:-140px;top:1180px;background:#D97757;opacity:.12"></div>
<div class="blob" id="b2" style="width:360px;height:360px;right:-120px;top:300px;background:#788C5D;opacity:.12"></div>
<div class="top"><span class="chip"><i></i><span id="chap"></span></span><span id="pg"></span></div>
<div class="prog"><i id="pb"></i></div>
<h1 id="t"></h1>
<div id="stage"></div>
<div id="sub"></div>
<div class="foot" id="foot"></div>
<script src="scenes.js"></script>
<script>
let ST = null;
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const DUR = {fu:.7,fi:.6,pop:.6,sl:.7,sr:.7,drop:.8,stamp:.55,flip:.7,merge:.5,grow:1.6,growx:1.6,drawa:1.4};
window.setup = (si, starts, dur, total) => {
  const sc = SCENES[si];
  ST = {sc, starts, dur, si, total};
  const M = (typeof META !== 'undefined') ? META : {}; document.getElementById('chap').textContent = (M.series || 'AI 科普') + ' · ' + sc.chap; const ft = document.getElementById('foot'); ft.textContent = ''; const sg = document.createElement('b'); sg.style.color = 'var(--ink)'; sg.style.fontSize = '28px'; sg.textContent = M.author || '白羊武士'; ft.appendChild(sg); if (M.source) ft.appendChild(document.createTextNode('  ·  资料来源：' + M.source));
  document.getElementById('pg').textContent = String(si + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
  const t = document.getElementById('t'); t.innerHTML = sc.title;
  t.dataset.at = 0; t.dataset.a = 'fu'; t.dataset.d = 0;
  document.getElementById('sub').dataset.li = ''; const stage = document.getElementById('stage'); stage.innerHTML = sc.html();
  // wrap SVG elements that carry their own transform attribute so CSS transforms don't clobber them
  stage.querySelectorAll('svg [data-a]').forEach(el => {
    if (el.hasAttribute('transform')) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      for (const k of ['data-at', 'data-a', 'data-d', 'data-out']) if (el.hasAttribute(k)) { g.setAttribute(k, el.getAttribute(k)); el.removeAttribute(k); }
      el.parentNode.insertBefore(g, el); g.appendChild(el);
    }
  });
  const at = (el) => (starts[+el.dataset.at] ?? 0) + (+el.dataset.d || 0);
  document.querySelectorAll('[data-a]').forEach(el => {
    const a = el.dataset.a, s = at(el), parts = [`${a} ${DUR[a] || .6}s ${a === 'drawa' ? 'ease-in-out' : EASE} ${s}s both`];
    if (el.dataset.out !== undefined) parts.push(`out .45s ease ${starts[+el.dataset.out] - .05}s forwards`);
    el.style.animation = parts.join(',');
    el.querySelectorAll('.draw').forEach(p => p.style.animation = `drawa 1.2s ease-in-out ${s + .2}s both`);
  });
  (sc.dims || []).forEach(([li, sel]) => stage.querySelectorAll(sel).forEach(el => {
    el.style.animation = (el.style.animation ? el.style.animation + ',' : '') + `dim .5s ease ${starts[li]}s forwards`;
  }));
  document.getElementById('pb').style.width = (si / total * 100) + '%';
};
window.seek = (t) => {
  const {sc, starts, dur, si, total} = ST;
  document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
  // subtitle
  let li = 0; for (let i = 0; i < starts.length; i++) if (t >= starts[i] - .05) li = i;
  const sub = document.getElementById('sub');
  if (sub.dataset.li !== String(li)) { sub.dataset.li = li; sub.textContent = sc.lines[li]; }
  const since = t - starts[li]; sub.style.opacity = Math.min(1, .35 + since / .2); sub.style.transform = `translateY(${Math.max(0, 10 - since * 60)}px)`;
  // counters
  document.querySelectorAll('[data-count]').forEach(el => {
    const s = starts[+el.dataset.at] + (+el.dataset.d || 0), d = +el.dataset.dur || 1.5, from = +(el.dataset.from || 0), to = +el.dataset.count;
    let p = Math.min(1, Math.max(0, (t - s) / d)); p = 1 - Math.pow(1 - p, 3);
    el.textContent = (from + (to - from) * p).toFixed(1);
  });
  // progress, scene transitions, ambient drift
  document.getElementById('pb').style.width = ((si + Math.min(1, t / dur)) / total * 100) + '%';
  const stage = document.getElementById('stage');
  const inP = Math.min(1, t / .45), outP = Math.min(1, Math.max(0, (dur - t) / .4));
  const o = Math.min(inP, outP);
  stage.style.opacity = o; stage.style.transform = `translateY(${(1 - inP) * 40 - (1 - outP) * 30}px) scale(${1 + t * 0.0012})`;
  document.getElementById('t').style.opacity = Math.min(1, outP * 1.2);
  document.getElementById('b1').style.transform = `translate(${Math.sin(t / 3) * 30}px,${Math.cos(t / 4) * 20}px)`;
  document.getElementById('b2').style.transform = `translate(${Math.cos(t / 3.5) * 30}px,${Math.sin(t / 2.5) * 25}px)`;
};
</script></body></html>
